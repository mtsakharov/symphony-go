services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fastapi_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  fastapi-service:
    build:
      context: .
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    env_file:
      - .env

volumes:
  postgres-data:
