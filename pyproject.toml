[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-service"
version = "1.0.0"
description = "Production-ready FastAPI service with health checks and OpenAPI documentation."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Codex" },
]
dependencies = [
    "alembic>=1.17.2",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "psycopg[binary]>=3.2.12",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
serve = "app.main:run"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=2.1.0",
  "pytest-cov>=7.0.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]
